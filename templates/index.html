
<!DOCTYPE html>
<html>
<head>
    <title>Student Information Management</title>
</head>
<body>

    <h1>Student Information Management System</h1>

    <a href="/register">
        <button>Add New Student</button>
    </a>

    <h2>Registered Students</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>

            <td>

                <a href="/update/{{ student[0] }}">
                    <button>Edit</button>
                </a>

                <form action="/delete/{{ student[0] }}"
                      method="POST"
                      style="display:inline;">

                    <button type="submit"
                    onclick="return confirm('Delete this student?')">
                        Delete
                    </button>

                </form>

            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
